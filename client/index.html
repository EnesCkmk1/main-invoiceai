<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InvoiceFlow AI — Create &amp; send invoices in 30 seconds</title>
    <meta name="description" content="InvoiceFlow AI helps Danish freelancers and small businesses create, send and get paid on professional invoices in under 30 seconds. AI-assisted, beautiful PDFs, online payments — 99 DKK/month." />
    <meta name="keywords" content="invoicing, faktura, fakturering, freelancer, small business, Denmark, DKK, VAT, AI invoice" />
    <meta name="author" content="InvoiceFlow AI" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://invoiceflow.ai/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InvoiceFlow AI" />
    <meta property="og:title" content="InvoiceFlow AI — Invoices in 30 seconds" />
    <meta property="og:description" content="The fastest way to send a professional invoice. Not an accounting program — just invoicing. Built for freelancers and small businesses in Denmark." />
    <meta property="og:url" content="https://invoiceflow.ai/" />
    <meta property="og:locale" content="en_DK" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InvoiceFlow AI — Invoices in 30 seconds" />
    <meta name="twitter:description" content="Create, send and get paid on beautiful invoices in under 30 seconds. AI-assisted invoicing for Danish freelancers and SMBs." />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "InvoiceFlow AI",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "Fast invoicing software for freelancers and small businesses. Create and send professional invoices in under 30 seconds with optional AI assistance.",
        "url": "https://invoiceflow.ai/",
        "offers": {
          "@type": "Offer",
          "price": "99",
          "priceCurrency": "DKK",
          "priceValidUntil": "2027-12-31",
          "availability": "https://schema.org/InStock"
        },
        "featureList": [
          "AI invoice creation",
          "Branded PDF invoices",
          "Online payments",
          "Automatic payment reminders",
          "Invoice tracking and analytics"
        ],
        "inLanguage": ["en", "da"],
        "areaServed": {
          "@type": "Country",
          "name": "Denmark"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
